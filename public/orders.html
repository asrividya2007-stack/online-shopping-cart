<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders | ShopEase</title><link rel="stylesheet" href="style.css"></head>
<body><header><h1>🧾 Orders Management</h1><nav><a href="index.html">Home</a><a href="user.html">Users</a><a href="products.html">Products</a><a href="cart.html">Cart</a><a href="orders.html">Orders</a></nav></header>
<main class="container"><section class="panel"><h2 id="formTitle">Create Order</h2><form id="orderForm"><input id="user_id" type="number" min="1" placeholder="User ID" required><input id="total_amount" type="number" min="0" step="0.01" placeholder="Total Amount" required><select id="status"><option>Pending</option><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select><button id="saveBtn">Create Order</button><button type="button" class="secondary" onclick="resetForm()">Clear</button></form><div id="message"></div></section><section class="panel"><h2>Orders List</h2><div class="table-wrap"><table><thead><tr><th>Order ID</th><th>User</th><th>Total Amount</th><th>Order Date</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script>
let editingId=null,cache=[];const $=id=>document.getElementById(id);
async function load(){let r=await fetch('/api/orders');cache=await r.json();$('rows').innerHTML=cache.map(o=>`<tr><td>${o.order_id}</td><td>${o.name} (#${o.user_id})</td><td>₹${o.total_amount}</td><td>${new Date(o.order_date).toLocaleString()}</td><td>${o.status}</td><td><div class="actions"><button onclick="editOrder(${o.order_id})">Edit</button><button class="danger" onclick="removeOrder(${o.order_id})">Delete</button></div></td></tr>`).join('')}
$('orderForm').onsubmit=async e=>{e.preventDefault();let data={user_id:$('user_id').value,total_amount:$('total_amount').value,status:$('status').value};let r=await fetch(editingId?'/api/orders/'+editingId:'/api/orders',{method:editingId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let x=await r.json();$('message').textContent=x.error||'Order saved successfully';if(!x.error){resetForm();load()}};
function editOrder(id){let o=cache.find(x=>x.order_id===id);editingId=id;$('user_id').value=o.user_id;$('total_amount').value=o.total_amount;$('status').value=o.status;$('formTitle').textContent='Update Order';$('saveBtn').textContent='Update Order'}
async function removeOrder(id){if(confirm('Delete this order?')){let r=await fetch('/api/orders/'+id,{method:'DELETE'});let x=await r.json();$('message').textContent=x.error||'Order deleted';load()}}
function resetForm(){editingId=null;$('orderForm').reset();$('formTitle').textContent='Create Order';$('saveBtn').textContent='Create Order'}load();
</script></body></html>
