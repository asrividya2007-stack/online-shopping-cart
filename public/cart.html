
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cart | ShopEase</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🛒 Shopping Cart</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="user.html">Users</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="orders.html">Orders</a>
    </nav>
</header>

<main class="container">

    <!-- ADD CART FORM -->
    <section class="panel">

        <h2 id="formTitle">Add Item to Cart</h2>

        <form id="cartForm">

            <input
                id="user_id"
                type="number"
                min="1"
                placeholder="User ID"
                required
            >

            <input
                id="product_id"
                type="number"
                min="1"
                placeholder="Product ID"
                required
            >

            <input
                id="quantity"
                type="number"
                min="1"
                value="1"
                placeholder="Quantity"
                required
            >

            <button type="submit" id="saveBtn">
                Add to Cart
            </button>

            <button
                type="button"
                class="secondary"
                onclick="resetForm()"
            >
                Clear
            </button>

        </form>

        <p class="hint">
            Enter existing User ID and Product ID from their respective lists.
        </p>

        <div id="message"></div>

    </section>


    <!-- CART ITEMS TABLE -->
    <section class="panel">

        <h2>Cart Items</h2>

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>Cart ID</th>
                        <th>User</th>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Item Total</th>
                        <th>Added Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="rows">
                    <tr>
                        <td colspan="8">Loading cart items...</td>
                    </tr>
                </tbody>

            </table>

        </div>

    </section>

</main>


<script>

let editingId = null;
let cache = [];

const $ = id => document.getElementById(id);


// --------------------------------
// DATE FORMAT
// --------------------------------

function formatDate(date) {

    if (!date) {
        return "Not Available";
    }

    const d = new Date(date);

    if (
        isNaN(d.getTime()) ||
        d.getFullYear() < 2000
    ) {
        return "Not Available";
    }

    return d.toLocaleString("en-IN", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
    });

}


// --------------------------------
// CURRENCY FORMAT
// --------------------------------

function formatPrice(price) {

    return "₹" + Number(price || 0).toFixed(2);

}


// --------------------------------
// LOAD ALL CART ITEMS
// --------------------------------

async function load() {

    const tbody = $("rows");

    try {

        const response = await fetch("/api/cart");

        if (!response.ok) {
            throw new Error("Unable to fetch cart items");
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
            throw new Error(data.error || "Invalid cart response");
        }

        cache = data;

        if (cache.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="8">
                        No cart items found.
                    </td>
                </tr>
            `;

            return;
        }


        // DISPLAY EVERY CART RECORD

        tbody.innerHTML = cache.map(c => {

            const total =
                c.item_total !== null &&
                c.item_total !== undefined
                    ? Number(c.item_total)
                    : Number(c.price) * Number(c.quantity);

            return `

                <tr>

                    <td>${c.cart_id}</td>

                    <td>
                        ${c.name || "Unknown"}
                        (#${c.user_id})
                    </td>

                    <td>
                        ${c.product_name || "Unknown"}
                    </td>

                    <td>
                        ${formatPrice(c.price)}
                    </td>

                    <td>
                        ${c.quantity}
                    </td>

                    <td>
                        ${formatPrice(total)}
                    </td>

                    <td>
                        ${formatDate(c.added_date)}
                    </td>

                    <td>

                        <div class="actions">

                            <button
                                type="button"
                                onclick="editCart(${c.cart_id})"
                            >
                                Edit
                            </button>

                            <button
                                type="button"
                                class="danger"
                                onclick="removeCart(${c.cart_id})"
                            >
                                Delete
                            </button>

                        </div>

                    </td>

                </tr>

            `;

        }).join("");


    } catch (error) {

        console.error("Cart loading error:", error);

        tbody.innerHTML = `
            <tr>
                <td colspan="8">
                    Error loading cart items.
                    Check your backend server.
                </td>
            </tr>
        `;

    }

}


// --------------------------------
// ADD / UPDATE CART ITEM
// --------------------------------

$("cartForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const data = {

        user_id: Number($("user_id").value),

        product_id: Number($("product_id").value),

        quantity: Number($("quantity").value)

    };

    try {

        const url = editingId
            ? `/api/cart/${editingId}`
            : "/api/cart";

        const method = editingId ? "PUT" : "POST";

        const response = await fetch(url, {

            method: method,

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(data)

        });

        const result = await response.json();

        if (!response.ok) {

            throw new Error(result.error || "Unable to save cart item");

        }

        $("message").textContent =
            editingId
                ? "Cart item updated successfully!"
                : "Item added to cart successfully!";

        resetForm();

        await load();

    } catch (error) {

        $("message").textContent = error.message;

    }

});


// --------------------------------
// EDIT CART ITEM
// --------------------------------

function editCart(id) {

    const c = cache.find(
        item => Number(item.cart_id) === Number(id)
    );

    if (!c) {

        alert("Cart item not found");

        return;

    }

    editingId = id;

    $("user_id").value = c.user_id;

    $("product_id").value = c.product_id;

    $("quantity").value = c.quantity;

    $("user_id").disabled = true;

    $("product_id").disabled = true;

    $("formTitle").textContent = "Update Cart Quantity";

    $("saveBtn").textContent = "Update Cart";

    $("message").textContent = "";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// --------------------------------
// DELETE CART ITEM
// --------------------------------

async function removeCart(id) {

    if (!confirm("Are you sure you want to delete this cart item?")) {

        return;

    }

    try {

        const response = await fetch(`/api/cart/${id}`, {

            method: "DELETE"

        });

        const result = await response.json();

        if (!response.ok) {

            throw new Error(result.error || "Delete failed");

        }

        $("message").textContent =
            "Cart item deleted successfully!";

        if (Number(editingId) === Number(id)) {
            resetForm();
        }

        await load();

    } catch (error) {

        $("message").textContent = error.message;

    }

}


// --------------------------------
// CLEAR FORM
// --------------------------------

function resetForm() {

    editingId = null;

    $("cartForm").reset();

    $("quantity").value = 1;

    $("user_id").disabled = false;

    $("product_id").disabled = false;

    $("formTitle").textContent = "Add Item to Cart";

    $("saveBtn").textContent = "Add to Cart";

}


// --------------------------------
// INITIAL LOAD
// --------------------------------

load();

</script>

</body>
</html>
