<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products | ShopEase</title><link rel="stylesheet" href="style.css"></head>
<body><header><h1>📦 Products Management</h1><nav><a href="index.html">Home</a><a href="user.html">Users</a><a href="products.html">Products</a><a href="cart.html">Cart</a><a href="orders.html">Orders</a></nav></header>
<main class="container"><section class="panel"><h2 id="formTitle">Add Product</h2><form id="productForm"><input id="product_name" placeholder="Product name" required><input id="category" placeholder="Category" required><input id="price" type="number" min="0" step="0.01" placeholder="Price" required><input id="stock" type="number" min="0" placeholder="Stock" required><input id="description" placeholder="Description"><button id="saveBtn">Add Product</button><button type="button" class="secondary" onclick="resetForm()">Clear</button></form><div id="message"></div></section><section class="panel"><h2>Products List</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Description</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script>
let editingId=null,cache=[];const $=id=>document.getElementById(id);
async function load(){let r=await fetch('/api/products');cache=await r.json();$('rows').innerHTML=cache.map(p=>`<tr><td>${p.product_id}</td><td>${p.product_name}</td><td>${p.category}</td><td>₹${p.price}</td><td>${p.stock}</td><td>${p.description||''}</td><td><div class="actions"><button onclick="editProduct(${p.product_id})">Edit</button><button class="danger" onclick="removeProduct(${p.product_id})">Delete</button></div></td></tr>`).join('')}
$('productForm').onsubmit=async e=>{e.preventDefault();let data={product_name:$('product_name').value,category:$('category').value,price:$('price').value,stock:$('stock').value,description:$('description').value};let r=await fetch(editingId?'/api/products/'+editingId:'/api/products',{method:editingId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let x=await r.json();$('message').textContent=x.error||'Product saved successfully';if(!x.error){resetForm();load()}};
function editProduct(id){let p=cache.find(x=>x.product_id===id);editingId=id;['product_name','category','price','stock','description'].forEach(k=>$(k).value=p[k]??'');$('formTitle').textContent='Update Product';$('saveBtn').textContent='Update Product'}
async function removeProduct(id){if(confirm('Delete this product?')){let r=await fetch('/api/products/'+id,{method:'DELETE'});let x=await r.json();$('message').textContent=x.error||'Product deleted';load()}}
function resetForm(){editingId=null;$('productForm').reset();$('formTitle').textContent='Add Product';$('saveBtn').textContent='Add Product'}load();
</script></body></html>
